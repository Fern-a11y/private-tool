<!DOCTYPE html>
<html>
<head>
    <title>Roblox Profile Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<div id="login">

    <h1>Roblox Profile Finder</h1>

    <p>Enter access code</p>

    <input 
        id="password"
        type="password"
        placeholder="6 digit code"
    >

    <br>

    <button onclick="login()">
        Enter
    </button>

    <p id="loginError"></p>

</div>



<div id="app" style="display:none">


    <div class="container">

        <h1>Roblox Profile Finder</h1>


        <div class="search">

            <input 
                id="username"
                placeholder="Enter Roblox username"
            >

            <button onclick="findUser()">
                Search
            </button>

        </div>


        <div id="result"></div>


    </div>


</div>



<script src="script.js"></script>

</body>
</html>
