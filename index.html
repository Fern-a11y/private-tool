<!DOCTYPE html>
<html>
<head>
    <title>Roblox Moderation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="login">

    <h1>Roblox Moderation</h1>

    <p>Enter access code</p>

    <input 
        id="code"
        type="password"
        placeholder="Code"
    >

    <button onclick="login()">
        Login
    </button>

    <p id="error"></p>

</div>


<div id="panel" style="display:none">

    <h1>Moderation Panel</h1>


    <div class="card">
        👤 Player Lookup
        <br>
        <button>
            Open
        </button>
    </div>


    <div class="card">
        🔨 Ban User
        <br>
        <button>
            Open
        </button>
    </div>


    <div class="card">
        📜 Ban History
        <br>
        <button>
            Open
        </button>
    </div>


</div>


<script src="script.js"></script>

</body>
</html>
